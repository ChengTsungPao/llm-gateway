[project]
name = "llm-gateway"
version = "0.1.0"
description = "One OpenAI-compatible endpoint and web UI for local models on a single GPU: Ollama and tuned llama.cpp profiles, one model loaded at a time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
llm-gateway = "llm_gateway.__main__:main"
llm-agent = "llm_gateway.agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
